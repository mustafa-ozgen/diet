<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Diyet Programım">
    <meta name="description" content="Günlük diyet programı takip uygulaması">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Diyet Programım</title>
</head>
<body>
    <div class="bg-decor" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="app">
        <header class="hero">
            <div class="hero-top">
                <div class="brand">
                    <div class="brand-icon">&#129367;</div>
                    <div>
                        <h1>Diyet Programım</h1>
                        <p id="dateLine">Bugünkü planın hazır</p>
                    </div>
                </div>
                <button id="refreshBtn" class="icon-btn" title="Yenile" aria-label="Yenile">&#10227;</button>
            </div>
            <nav class="program-pills" id="programPills" aria-label="Diyet programları">
                <button class="pill active" data-program="dietprogram1"><span class="pill-emoji">&#129382;</span><span>Diyet 1</span></button>
                <button class="pill" data-program="dietprogram2"><span class="pill-emoji">&#9749;</span><span>Diyet 2</span></button>
                <button class="pill" data-program="dietprogram3_fatburn"><span class="pill-emoji">&#128293;</span><span>Fat Burn</span></button>
            </nav>
        </header>
        <main class="content">
            <section class="program-hero" id="programHero">
                <div class="program-hero-text">
                    <span class="eyebrow">Aktif Program</span>
                    <h2 id="programName">Yükleniyor...</h2>
                    <p id="programMeta"></p>
                </div>
                <div class="program-hero-badge" id="programBadge">&#129367;</div>
            </section>
            <div class="meal-timeline" id="dietContainer">
                <div class="loading"><div class="spinner"></div><p>Program yükleniyor...</p></div>
            </div>
        </main>
        <footer class="app-footer">
            <span id="lastUpdated">Güncelleniyor...</span>
            <span class="live-dot"><i></i>Otomatik senkron açık</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
